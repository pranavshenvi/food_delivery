# Kafka 3.8.1, KRaft combined mode, node 3 (L3). Replace the 10.147.17.x IPs with your VMs' ZeroTier IPs.
# 2-node cluster (L2 + L3 only). Losing either node loses controller quorum -- that's the tradeoff
# for putting all Kafka duty on 2 laptops instead of 3.
process.roles=broker,controller
node.id=3
controller.quorum.voters=2@10.147.17.12:9093,3@10.147.17.13:9093
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://10.147.17.13:9092
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
log.dirs=/opt/kafka-data
num.partitions=4
default.replication.factor=2
min.insync.replicas=1
offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1
auto.create.topics.enable=false
group.initial.rebalance.delay.ms=0

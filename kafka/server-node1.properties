# Kafka 3.8.1, KRaft combined mode (broker + controller) on VM2 (node 1).
# The ONLY controller in the cluster. Kill node 2 (VM3, broker only) for the failure test.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@172.22.134.139:9093
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://172.22.134.139:9092
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
log.dirs=/opt/kafka-data
num.partitions=2
default.replication.factor=2
min.insync.replicas=1
offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1
auto.create.topics.enable=false
group.initial.rebalance.delay.ms=0

# Kafka 3.8.1, KRaft broker-only node, node 2 = 172.22.114.189.
# Not a controller voter -- it registers with the controller on node 1. This is the node to kill
# in the failure drill: the controller survives and moves leadership of its partitions to node 1.
process.roles=broker
node.id=2
controller.quorum.voters=1@172.22.134.139:9093
listeners=PLAINTEXT://0.0.0.0:9092
advertised.listeners=PLAINTEXT://172.22.114.189:9092
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
log.dirs=/opt/kafka-data
num.partitions=4
default.replication.factor=2
min.insync.replicas=1
offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1
auto.create.topics.enable=false
group.initial.rebalance.delay.ms=0
